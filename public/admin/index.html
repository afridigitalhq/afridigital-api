<!DOCTYPE html>
<html>
<head>
  <title>AfriDigital Admin Live Dashboard</title>
  <style>
    body { font-family: Arial; background:#0b0f14; color:#00ffcc; margin:0; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px; }
    .card { background:#111826; padding:10px; border-radius:10px; height:300px; overflow:auto; }
    h2 { font-size:14px; margin:0 0 10px 0; color:#7cf7d4; }
    .event { font-size:12px; border-bottom:1px solid #1f2a3a; padding:4px; }
  </style>
</head>
<body>

<h2 style="padding:10px;">🧠 AFRI LIVE CONTROL CENTER</h2>

<div class="grid">
  <div class="card" id="events">
    <h2>📡 Event Stream</h2>
  </div>

  <div class="card" id="payments">
    <h2>💳 Payment Flow</h2>
  </div>

  <div class="card" id="ai">
    <h2>🤖 AI Decisions</h2>
  </div>

  <div class="card" id="system">
    <h2>🧱 System Health</h2>
  </div>
</div>

<script src="/js/event.client.js"></script>

<script>
window.afriEventHandler = function(event) {

  const el = document.getElementById("events");

  const div = document.createElement("div");
  div.className = "event";
  div.innerText = event.event + " → " + JSON.stringify(event.payload);

  el.prepend(div);

  // Routing logic
  if (event.event.includes("PAYMENT")) {
    document.getElementById("payments").prepend(div.cloneNode(true));
  }

  if (event.event.includes("AI")) {
    document.getElementById("ai").prepend(div.cloneNode(true));
  }

  if (event.event.includes("RENDER") || event.event.includes("HEALTH")) {
    document.getElementById("system").prepend(div.cloneNode(true));
  }
};
</script>

undefined
</html>
