<!DOCTYPE html>
<html>
<head>
  <title>AfriBk Observability</title>
  <style>
    body { background:#0b0f1a; color:#00ffcc; font-family:monospace; padding:20px; }
    .box { border:1px solid #00ffcc; padding:10px; margin:10px 0; }
  </style>
</head>
<body>

<h2>📡 LIVE OBSERVABILITY DASHBOARD</h2>

<div class="box" id="status">Connecting...</div>
<div class="box" id="log"></div>

<script>
const logBox = document.getElementById("log");
const status = document.getElementById("status");

const es = new EventSource("/stream");

es.onopen = () => status.innerText = "🟢 Connected";

es.onmessage = (e) => {
  const data = JSON.parse(e.data);
  logBox.innerHTML = `
    <div>🧠 EVENT: ${data.event}</div>
    <div>⏱ ${data.ts}</div>
    <pre>${JSON.stringify(data, null, 2)}</pre>
    <hr/>
  ` + logBox.innerHTML;
};
</script>

</body>
</html>
