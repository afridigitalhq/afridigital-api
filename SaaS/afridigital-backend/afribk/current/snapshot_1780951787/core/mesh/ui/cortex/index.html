<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>AfriBrain WebGL Cortex</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, #02030a, #000);
    font-family: monospace;
  }

  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #00ffe1;
    font-size: 12px;
    z-index: 10;
  }
</style>
</head>

<body>
<div id="hud">🧠 Initializing Cortex...</div>

<script>
// ---------------------------
// BASIC WEBGL SCENE
// ---------------------------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ---------------------------
// NEURAL NODES (SPHERES)
// ---------------------------
const nodes = [];
const nodeData = [
  "Kernel", "Flow", "EventBus", "Redis", "WS", "AdminGraph"
];

const geometry = new THREE.SphereGeometry(0.5, 16, 16);

function createNode(i) {
  const material = new THREE.MeshBasicMaterial({ color: 0x00ffe1 });
  const mesh = new THREE.Mesh(geometry, material);

  const angle = (i / nodeData.length) * Math.PI * 2;
  mesh.position.x = Math.cos(angle) * 5;
  mesh.position.z = Math.sin(angle) * 5;
  mesh.position.y = Math.sin(angle * 2) * 2;

  mesh.userData = { heat: 0, label: nodeData[i] };

  scene.add(mesh);
  nodes.push(mesh);
}

nodeData.forEach((_, i) => createNode(i));

// ---------------------------
// LIGHTING (GLOW FEEL)
// ---------------------------
const light = new THREE.PointLight(0x00ffe1, 2, 50);
scene.add(light);

camera.position.z = 12;

// ---------------------------
// SYNAPTIC LINKS (LINES)
// ---------------------------
const links = [];

function connect(a, b) {
  const material = new THREE.LineBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.3 });

  const points = [];
  points.push(nodes[a].position);
  points.push(nodes[b].position);

  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const line = new THREE.Line(geometry, material);

  scene.add(line);
  links.push({ line, a, b });
}

connect(0,1);
connect(1,2);
connect(2,3);
connect(3,4);
connect(4,5);
connect(5,0);

// ---------------------------
// HEAT PROPAGATION ENGINE
// ---------------------------
function propagateHeat() {
  nodes.forEach(n => {
    n.userData.heat *= 0.92;
  });

  const active = Math.floor(Math.random() * nodes.length);
  nodes[active].userData.heat = 1;

  links.forEach(l => {
    const heat = nodes[l.a].userData.heat;

    l.line.material.opacity = 0.1 + heat * 0.8;
  });

  nodes.forEach(n => {
    const h = n.userData.heat;

    n.material.color.setRGB(0, 1, 0.9 - h * 0.5);
    n.scale.set(1 + h, 1 + h, 1 + h);
  });
}

// ---------------------------
// ANIMATION LOOP
// ---------------------------
function animate() {
  requestAnimationFrame(animate);

  scene.rotation.y += 0.002;

  propagateHeat();

  renderer.render(scene, camera);
}

animate();

// ---------------------------
// WEBSOCKET INTEGRATION
// ---------------------------
const ws = new WebSocket("wss://" + window.location.host);

ws.onopen = () => {
  document.getElementById("hud").innerText = "🧠 Cortex ONLINE";
};

ws.onmessage = (msg) => {
  try {
    const data = JSON.parse(msg.data);

    if (data.type === "AFRIBRAIN_TICK") {
      const idx = Math.floor(Math.random() * nodes.length);
      nodes[idx].userData.heat = 1;
    }
  } catch (e) {}
};

// ---------------------------
// RESIZE HANDLER
// ---------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
