<!-- PREMIUM AFRIDIGITAL UI -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfriDigital</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white">

<!-- HERO -->
<section class="relative bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 text-center py-28 px-6">
  <h1 class="text-5xl md:text-7xl font-extrabold">AfriDigital</h1>
  <p class="text-blue-200 mt-4">Cybersecurity • DevOps Intelligence • Monitoring</p>
</section>

<!-- STATUS BAR -->
<section class="bg-slate-900 border-y border-slate-800 py-3 text-center text-slate-400 text-sm">
  System Online • API Stable • Threat Monitoring Active
</section>

<!-- AUTH -->
<section class="py-24 text-center">
  <div class="max-w-md mx-auto bg-slate-900 border border-slate-800 p-8 rounded-2xl">
    <h2 class="text-2xl mb-6">Secure Access</h2>
    <input class="w-full mb-3 p-3 bg-slate-800 rounded" placeholder="Email">
    <input class="w-full mb-3 p-3 bg-slate-800 rounded" placeholder="Password">
    <button class="w-full bg-blue-600 py-3 rounded">Login</button>
  </div>
</section>

<!-- SERVICES -->
<section class="py-20 px-6">
  <h2 class="text-center text-3xl mb-10">Core Modules</h2>
  <div class="grid md:grid-cols-3 gap-6 max-w-5xl mx-auto">

    <div class="p-6 bg-slate-900 border border-slate-800 rounded-xl">Cybersecurity</div>
    <div class="p-6 bg-slate-900 border border-slate-800 rounded-xl">DevOps Monitoring</div>
    <div class="p-6 bg-slate-900 border border-slate-800 rounded-xl">Incident Response</div>

  </div>
</section>

<!-- FOOTER -->
<footer class="py-10 text-center border-t border-slate-800 text-slate-500">
  AfriDigital © 2026
</footer>

<!-- CHAT -->
<div class="fixed bottom-6 right-6 bg-blue-600 p-4 rounded-full">💬</div>

</body>
</html>
