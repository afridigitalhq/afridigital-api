<!DOCTYPE html>
<html>
<head>
  <title>AfriDigital Trace Dashboard</title>
  <style>
    body {
      font-family: monospace;
      background: #0b0f14;
      color: #00ff9f;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #ffffff;
    }
    #log {
      margin-top: 20px;
      padding: 10px;
      background: #111827;
      height: 80vh;
      overflow-y: auto;
      border-radius: 8px;
    }
    .event {
      padding: 4px 0;
      border-bottom: 1px solid #1f2937;
    }
    .http { color: #60a5fa; }
    .worker { color: #fbbf24; }
    .ai { color: #34d399; }
    .heartbeat { color: #9ca3af; }
  </style>
</head>
<body>

<h1>⚡ AfriDigital Live Trace Dashboard</h1>
<div id="status">Connecting...</div>
<div id="log"></div>

<script>
  const log = document.getElementById('log');
  const status = document.getElementById('status');

  const es = new EventSource('/trace');

  es.onopen = () => {
    status.innerText = '🟢 Connected to Trace Stream';
  };

  es.onerror = () => {
    status.innerText = '🔴 Disconnected';
  };

  es.onmessage = (event) => {
    const data = JSON.parse(event.data);

    const div = document.createElement('div');
    div.className = 'event ' + (data.type || 'unknown');

    div.innerText = `[${new Date().toLocaleTimeString()}] ` +
      JSON.stringify(data);

    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  };
</script>

</body>
</html>
