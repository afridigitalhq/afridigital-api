<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>AfriBrain GPU Cortex</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<style>
  body { margin:0; overflow:hidden; background:#000; }
  #hud {
    position:absolute;
    top:10px;
    left:10px;
    color:#00ffe1;
    font-family:monospace;
    font-size:12px;
  }
</style>
</head>

<body>
<div id="hud">🧠 GPU Cortex booting...</div>

<script>
// ============================
// GPU CORE SETUP
// ============================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ============================
// PARTICLE FIELD (NEURAL GRID)
// ============================
const SIZE = 64;
const particles = SIZE * SIZE;

const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(particles * 3);
const heat = new Float32Array(particles);

for (let i = 0; i < particles; i++) {
  positions[i*3] = (Math.random() - 0.5) * 10;
  positions[i*3+1] = (Math.random() - 0.5) * 10;
  positions[i*3+2] = (Math.random() - 0.5) * 10;

  heat[i] = Math.random() * 0.2;
}

geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
geometry.setAttribute("heat", new THREE.BufferAttribute(heat, 1));

// ============================
// GPU SHADER MATERIAL
// ============================
const material = new THREE.ShaderMaterial({

  uniforms: {
    time: { value: 0 },
    intensity: { value: 1.0 }
  },

  vertexShader: `
    attribute float heat;
    varying float vHeat;

    void main() {
      vHeat = heat;

      vec3 p = position;

      // heat expands position slightly (attention distortion)
      p += normalize(p) * heat * 0.5;

      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 2.0 + heat * 6.0;
    }
  `,

  fragmentShader: `
    varying float vHeat;

    void main() {

      vec3 cold = vec3(0.0, 0.2, 0.3);
      vec3 hot  = vec3(0.0, 1.0, 0.9);

      vec3 color = mix(cold, hot, vHeat);

      float alpha = 0.6 + vHeat * 0.4;

      gl_FragColor = vec4(color, alpha);
    }
  `,

  transparent: true
});

const mesh = new THREE.Points(geometry, material);
scene.add(mesh);

// ============================
// GPU HEAT DIFFUSION ENGINE
// ============================
function stepPhysics() {

  const heatAttr = geometry.attributes.heat.array;

  for (let i = 0; i < particles; i++) {

    // decay
    heatAttr[i] *= 0.96;

    // neighbor diffusion (cheap approximation)
    const j = (i + 1) % particles;
    heatAttr[i] += heatAttr[j] * 0.02;
  }

  // random neural spike (external stimulus)
  const spike = Math.floor(Math.random() * particles);
  heatAttr[spike] = 1.0;

  geometry.attributes.heat.needsUpdate = true;
}

// ============================
// ANIMATION LOOP
// ============================
function animate() {

  requestAnimationFrame(animate);

  material.uniforms.time.value += 0.01;

  scene.rotation.y += 0.0015;
  scene.rotation.x += 0.0008;

  stepPhysics();

  renderer.render(scene, camera);
}

animate();

// ============================
// WEBSOCKET ATTENTION INPUT
// ============================
const ws = new WebSocket("wss://" + window.location.host);

ws.onmessage = (msg) => {
  try {
    const data = JSON.parse(msg.data);

    if (data.type === "AFRIBRAIN_TICK") {

      const heatAttr = geometry.attributes.heat.array;
      const idx = Math.floor(Math.random() * particles);

      // ATTENTION ROUTING: force spike
      heatAttr[idx] = 1.0;
      geometry.attributes.heat.needsUpdate = true;
    }
  } catch(e) {}
};

ws.onopen = () => {
  document.getElementById("hud").innerText = "🧠 GPU Cortex ONLINE";
};

window.addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
