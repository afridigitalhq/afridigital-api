services:
  - type: static
    name: afridigital-hub
    rootDir: SaaS/afridigital-frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://afridigital-api.onrender.com

  - type: web
    name: afridigital-api
    env: node
    rootDir: SaaS/afridigital-backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
