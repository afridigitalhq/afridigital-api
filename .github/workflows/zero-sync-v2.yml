name: ZERO-SYNC v2 Auto Build

on:
  push:
    branches: [ "master" ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: |
          cd SaaS/afridigital-frontend
          npm install

      - name: Build frontend
        run: |
          cd SaaS/afridigital-frontend
          npm run build

      - name: Sync to backend public
        run: |
          rm -rf SaaS/afridigital-backend/public/*
          cp -r SaaS/afridigital-frontend/dist/* SaaS/afridigital-backend/public/

      - name: Commit updated build
        run: |
          git config user.name "zero-sync-bot"
          git config user.email "actions@github.com"
          git add SaaS/afridigital-backend/public
          git commit -m "🤖 zero-sync v2 auto build" || echo "No changes"
          git push
